<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="W02 版本确认与受影响范围"><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#26352e}.title{font-size:24px;font-weight:700}.small{font-size:16px}.body{font-size:18px}.muted{fill:#53665c}rect{stroke:#b9c8bf;stroke-width:1.4}</style><rect width="1440" height="900" fill="#f5f7f5"/><text x="24" y="38" class="title">W02 版本确认与受影响范围 · 布局概念 非完整原型验证</text><rect x="20" y="60" width="1400" height="64" rx="6" fill="#fff"/><text x="36" y="90" class="body">项目 示例研发项目  /  TP-123  /  确认具体需求 v2                  返回任务 保留原阅读位置</text><rect x="20" y="138" width="1400" height="80" rx="6" fill="#edf6ee"/><text x="36" y="168" class="body">REQ-017 从 A1 改为 A2 · REQ-018 的 B1 影响已确认 unaffected · 整包当前 partial</text><text x="36" y="198" class="small muted">决定对象：REQ-017/A2；预期 manifest v2；当前人员：指定产品确认人</text><rect x="20" y="232" width="686" height="420" rx="6" fill="#fff"/><text x="36" y="262" class="body">v1：A1 / B1 已批准 · 指纹 1a2b…</text><text x="36" y="292" class="small muted">规则：资料齐全后进入规划</text><text x="36" y="322" class="small muted"></text><text x="36" y="352" class="small muted">历史结论与原始评论只读保留</text><text x="36" y="382" class="small muted">删除或移动段落时，旧锚点仍可打开</text><rect x="720" y="232" width="700" height="420" rx="6" fill="#fff"/><text x="736" y="262" class="body">v2：A2 待确认 / B1 原决定有效</text><text x="736" y="292" class="small muted">规则：资料齐全后进入规划</text><text x="736" y="322" class="small muted">新增：关键规则未答复时标记责任人与阻塞范围</text><text x="736" y="352" class="small muted"></text><text x="736" y="382" class="small muted">差异以文字/标记表达，不只靠颜色</text><rect x="20" y="666" width="900" height="206" rx="6" fill="#fff"/><text x="36" y="696" class="body">意见与影响</text><text x="36" y="726" class="small muted">意见锚定 REQ-017/A2；列明依赖闭包与评估人</text><text x="36" y="756" class="small muted">逐修订：批准 / 要求修改 / 拒绝；撤回另留事件</text><text x="36" y="786" class="small muted">并发 manifest 变化拒绝提交；未判影响阻断整包</text><rect x="934" y="666" width="486" height="206" rx="6" fill="#f0f4f0"/><text x="950" y="696" class="body">操作摘要</text><text x="950" y="726" class="small muted">对象、版本、范围、确认人和时间留痕</text><text x="950" y="756" class="small muted">[ 要求修改 ]       [ 批准 A2 修订 ]</text><text x="950" y="786" class="small muted">整包由有效决定聚合；关闭不批准任务</text></svg>