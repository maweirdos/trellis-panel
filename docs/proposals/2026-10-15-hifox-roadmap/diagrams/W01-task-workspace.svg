<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="W01 中央任务工作区"><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#26352e}.title{font-size:24px;font-weight:700}.small{font-size:16px}.body{font-size:18px}.muted{fill:#53665c}rect{stroke:#b9c8bf;stroke-width:1.4}</style><rect width="1440" height="900" fill="#f5f7f5"/><text x="24" y="38" class="title">W01 中央任务工作区 · 布局概念 非完整原型验证</text><rect x="20" y="60" width="1400" height="58" rx="6" fill="#fff"/><text x="36" y="90" class="body">项目 示例研发项目     /     工作项 TP-123                           搜索       工作视图 开发</text><rect x="20" y="132" width="84" height="740" rx="6" fill="#e8eee9"/><text x="36" y="162" class="body">概览</text><text x="36" y="192" class="small muted">接入</text><text x="36" y="222" class="small muted">工作项</text><text x="36" y="252" class="small muted">迭代</text><text x="36" y="282" class="small muted">知识</text><text x="36" y="312" class="small muted">会话</text><text x="36" y="342" class="small muted">团队</text><text x="36" y="372" class="small muted">统计</text><rect x="118" y="132" width="226" height="740" rx="6" fill="#f0f4f0"/><text x="134" y="162" class="body">当前视图</text><text x="134" y="192" class="small muted">我的未完成</text><text x="134" y="222" class="small muted">待我确认</text><text x="134" y="252" class="small muted">受阻</text><text x="134" y="282" class="small muted">归档</text><text x="134" y="312" class="small muted"></text><text x="134" y="342" class="small muted">上下文栏可收起</text><rect x="358" y="132" width="710" height="92" rx="6" fill="#fff"/><text x="374" y="162" class="body">TP-123 示例需求</text><text x="374" y="192" class="small muted">负责人 王某    业务 规划中    执行 尚未开始</text><rect x="358" y="238" width="710" height="76" rx="6" fill="#edf6ee"/><text x="374" y="268" class="body">材料 v2  /  指纹 a2b3…   /   等产品确认</text><text x="374" y="298" class="small muted">待办：李某核对新增异常流程；按稳定需求修订评审并聚合整版状态</text><rect x="358" y="328" width="710" height="380" rx="6" fill="#fff"/><text x="374" y="358" class="body">需求与决定      计划与执行      验证与交付</text><text x="374" y="388" class="small muted">目标与用户</text><text x="374" y="418" class="small muted">主流程和业务规则</text><text x="374" y="448" class="small muted">异常：缺关键资料时停留待澄清</text><text x="374" y="478" class="small muted">验收：版本明确、证据可读、未测项可见</text><text x="374" y="508" class="small muted"></text><text x="374" y="538" class="small muted">正文是主要工作区；新版到达不重置阅读位置</text><rect x="1082" y="132" width="338" height="320" rx="6" fill="#fff"/><text x="1098" y="162" class="body">辅助区 按需展开</text><text x="1098" y="192" class="small muted">来源 Jira / 示例实例 / TP-123</text><text x="1098" y="222" class="small muted">固定材料版本与历史决定</text><text x="1098" y="252" class="small muted">相关证据和检查点</text><text x="1098" y="282" class="small muted"></text><text x="1098" y="312" class="small muted">不把本机路径当团队链接</text><rect x="1082" y="466" width="338" height="242" rx="6" fill="#fff"/><text x="1098" y="496" class="body">任务会话 同一记录</text><text x="1098" y="526" class="small muted">运行 runtime / 机器 / 目录</text><text x="1098" y="556" class="small muted">等你回复 与 等人回复分开</text><text x="1098" y="586" class="small muted">无配置不阻断真人协作</text><rect x="358" y="722" width="1062" height="150" rx="6" fill="#f0f4f0"/><text x="374" y="752" class="body">工具区 默认收起</text><text x="374" y="782" class="small muted">运行服务 / 基础日志 / 只读 Git</text><text x="374" y="812" class="small muted">每个动作明确目标项目与进程；切页不停止运行</text></svg>