function publishDialog(){let i=get();openDialog(`<div class="dialog-head"><h2>发布到空间</h2><span class="spacer"></span><button class="iconbtn" data-action="close" aria-label="关闭">${icon('close')}</button></div><form id="publish-form"><div class="dialog-body"><p>将「${esc(i.title)}」的当前草稿固定为新版本。</p><label class="choice"><input type="radio" name="space" value="产品协作空间" checked><span><strong>产品协作空间</strong><small>成员可查看和评审 · 示例权限：可发布</small></span></label><label class="choice"><input type="radio" name="space" value="设计资料空间"><span><strong>设计资料空间</strong><small>示例权限：无发布权限</small></span></label><label class="choice"><input type="radio" name="space" value="模拟失败空间"><span><strong>模拟失败空间</strong><small>演示发布失败与重试</small></span></label><div id="publish-error" role="alert"></div><p style="margin:14px 0 0">私人会话不会随产物发布。</p></div><div class="dialog-foot"><button type="button" class="button" data-action="close">取消</button><button class="button primary" type="submit">发布固定版本</button></div></form>`)}
function adoptDialog(){let i=get(),v=selectedVersion(i);openDialog(`<div class="dialog-head"><h2>采用到任务</h2><span class="spacer"></span><button class="iconbtn" data-action="close" aria-label="关闭">${icon('close')}</button></div><form id="adopt-form"><div class="dialog-body"><p>${esc(v.title || i.title)} · v${v.n} · ${esc(v.space)}</p><label class="editor-label" for="task-select">选择任务</label><select id="task-select" class="wide"><option>需求工作台一期</option><option>设计交付流程</option><option>无权限任务（示例）</option><option>模拟失败任务</option></select><div id="adopt-error" role="alert"></div><p style="margin:14px 0 0">任务引用固定版本；采用不会提交任务阶段。</p></div><div class="dialog-foot"><button type="button" class="button" data-action="close">取消</button><button class="button primary" type="submit">确认采用</button></div></form>`)}
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,val=b.dataset.value,i=get();if(a==='theme'){s.theme=s.theme==='light'?'dark':'light'}else if(a==='scope'){if(s.dirty){flash('请先保存草稿');return}s.scope=val;s.page='list';s.type='全部';s.query=''}else if(a==='view'){s.view=val}else if(a==='new'){newDialog();return}else if(a==='open'){s.id=b.dataset.id;i=get();s.page='detail';s.revision=s.scope==='team'?String(i.versions.filter(v=>v.space==='产品协作空间').at(-1).n):'draft';s.tab='preview';s.dirty=false;s.editTitle=i.title;s.editBody=i.body}else if(a==='back'){if(s.dirty){flash('请先保存或继续编辑草稿');return}s.page='list'}else if(a==='tab'){if(s.dirty&&val!=='edit'){flash('请先保存草稿');return}s.tab=val}else if(a==='revision'){if(s.dirty){flash('请先保存草稿');return}s.revision=val;s.tab='preview'}else if(a==='proto'){s.protoState=val}else if(a==='save'){if(!s.editTitle.trim()){flash('请填写标题');return}i.title=s.editTitle.trim();i.body=s.editBody;i.time='刚刚';s.dirty=false;flash('草稿已保存到本次演示')}else if(a==='publish'){publishDialog();return}else if(a==='adopt'){adoptDialog();return}else if(a==='session'){if(s.dirty){flash('请先保存草稿');return}s.page='session'}else if(a==='return-detail'){s.page='detail'}else if(a==='comment'){let el=document.querySelector('#review-text'),anchor=document.querySelector('#review-anchor');if(!el.value.trim()){el.focus();flash('请填写意见');return}i.reviews.push({name:'我',text:el.value.trim(),status:'待处理',version:Number(s.revision)||0,anchor:anchor.value});flash('意见已记录到本次演示')}else if(a==='resolve'){i.reviews[Number(b.dataset.index)].status='已处理';flash('示例意见已标记处理')}else{return}render()});
app.addEventListener('input',e=>{if(e.target.id==='search'){s.query=e.target.value;let pos=e.target.selectionStart;render();let n=document.querySelector('#search');n.focus();n.setSelectionRange(pos,pos)}if(e.target.id==='edit-title'||e.target.id==='edit-body'){s[e.target.id==='edit-title'?'editTitle':'editBody']=e.target.value;s.dirty=true;let save=document.querySelector('[data-action=save]');if(save)save.disabled=false;let state=document.querySelector('.workbody .item-foot span');if(state)state.textContent='有未保存的修改';let publish=document.querySelector('[data-action=publish]');if(publish){publish.disabled=true;publish.title='请先保存草稿'}}});
app.addEventListener('change',e=>{let action=e.target.dataset.action;if(action==='density'){s.density=e.target.value}else if(action==='type'){s.type=e.target.value}else if(action==='select-revision'){if(s.dirty){e.target.value=s.revision;flash('请先保存草稿');return}s.revision=e.target.value;s.tab='preview'}else return;render()});
dialog.addEventListener('click',e=>{if(e.target.closest('[data-action=close]'))closeDialog()});dialog.addEventListener('close',()=>opener?.focus());dialog.addEventListener('submit',e=>{e.preventDefault();let i=get();if(e.target.id==='new-form'){let title=document.querySelector('#new-title').value.trim();if(!title)return;let x={id:'n'+Date.now(),title,type:document.querySelector('#new-type').value,desc:'本人新建的示例草稿',source:document.querySelector('#new-source').value.trim()||'未关联会话',group:'未分组',time:'刚刚',body:'',versions:[],reviews:[],adoptions:[],owner:'personal'};s.items.unshift(x);s.id=x.id;s.scope='personal';s.page='detail';s.tab='edit';s.revision='draft';s.editTitle=x.title;s.editBody='';s.dirty=false;closeDialog();render();flash('已创建本次演示草稿')}else if(e.target.id==='publish-form'){let space=new FormData(e.target).get('space'),err=document.querySelector('#publish-error');if(space==='设计资料空间'){err.innerHTML='<div class="notice error" style="margin-top:12px">无发布权限，请选择可发布的空间。</div>';return}if(space==='模拟失败空间'){err.innerHTML='<div class="notice error" style="margin-top:12px">模拟发布失败，草稿保留。可更换空间重试。</div>';return}let n=(i.versions.at(-1)?.n||0)+1;i.versions.push({n,space,time:'刚刚',title:i.title,body:i.body});s.revision=String(n);s.tab='preview';closeDialog();render();flash('模拟发布完成 · 仅保存在本次页面会话')}else if(e.target.id==='adopt-form'){let task=document.querySelector('#task-select').value,err=document.querySelector('#adopt-error');if(task.includes('无权限')){err.innerHTML='<div class="notice error" style="margin-top:12px">无任务采用权限，请选择其他任务。</div>';return}if(task==='模拟失败任务'){err.innerHTML='<div class="notice error" style="margin-top:12px">模拟采用失败，所选版本未改变，可重试或取消。</div>';return}let n=Number(s.revision);if(!i.adoptions.some(a=>a.task===task&&a.version===n))i.adoptions.push({task,version:n});closeDialog();render();flash(`模拟采用 v${n} · 未提交任务阶段`)}});
render();
</script></body></html>
