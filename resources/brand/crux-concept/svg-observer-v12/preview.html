<script>
'use strict';
const assets=JSON.parse(document.getElementById('assets').textContent);
const root=document.body,hero=document.getElementById('hero'),stage=document.getElementById('stage');
const playButton=document.getElementById('play'),followBox=document.getElementById('follow');
const reduceMedia=matchMedia('(prefers-reduced-motion: reduce)');
let selected='A',animations=[],svg=null,attention=null,baseAttention='',playing=false,following=false,reduce=reduceMedia.matches;
let loop=0,pointerFrame=0,phase='rest',generation=0,holdTime=0,gaze={x:0,y:0};
let svgIndex=0;
const errors=[];
addEventListener('error',e=>errors.push(e.message));
const phases=[{key:'overview',label:'观察全局',end:2800},{key:'focus',label:'聚焦',end:4000},{key:'gather',label:'汇集',end:5200},{key:'reply',label:'回应',end:6200},{key:'settle',label:'归位',end:7200}];
const icons={play:'<path d="m8 5 11 7-11 7Z"/>',pause:'<path d="M8 5v14M16 5v14"/>'};
function node(markup){const t=document.createElement('template');t.innerHTML=markup.trim();const el=t.content.firstElementChild;const prefix='preview-'+(++svgIndex)+'-';const all=[el,...el.querySelectorAll('*')],ids=new Map();all.forEach(n=>{if(n.id){ids.set(n.id,prefix+n.id);n.id=prefix+n.id}});all.forEach(n=>{[...n.attributes].forEach(a=>{let v=a.value;if(a.name==='aria-labelledby'||a.name==='aria-describedby')v=v.split(/\s+/).map(x=>ids.get(x)||x).join(' ');ids.forEach((to,from)=>{v=v.replaceAll('url(#'+from+')','url(#'+to+')');if((a.name==='href'||a.name==='xlink:href')&&v==='#'+from)v='#'+to});if(v!==a.value)n.setAttribute(a.name,v)})});return el}
function setPhase(key){if(phase===key)return;phase=key;const found=phases.find(p=>p.key===key);document.getElementById('phase-label').textContent=key==='pointer'?'交互观察':found?.label||'静态';document.querySelectorAll('.phase').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.phase===key)))}
function currentTime(){return animations.length?Number(animations[0].currentTime||0):holdTime}
function setGaze(x,y){gaze={x:Math.max(-6,Math.min(6,x)),y:Math.max(-6,Math.min(6,y))};if(attention)attention.setAttribute('transform',(baseAttention+' translate('+gaze.x.toFixed(3)+' '+gaze.y.toFixed(3)+')').trim())}
function resetGaze(){gaze={x:0,y:0};if(attention){if(baseAttention)attention.setAttribute('transform',baseAttention);else attention.removeAttribute('transform')}}
function updatePlay(){playButton.querySelector('svg').innerHTML=playing?icons.pause:icons.play;playButton.querySelector('span').textContent=playing?'暂停':'播放动效';playButton.setAttribute('aria-label',playing?'暂停动效':'播放动效');playButton.disabled=reduce;document.getElementById('restart').disabled=reduce;followBox.disabled=reduce}
function stopLoop(){if(loop)cancelAnimationFrame(loop);loop=0}
function pause(){stopLoop();playing=false;animations.forEach(a=>a.pause());holdTime=currentTime();updatePlay()}
function noFollow(){following=false;followBox.checked=false;stage.dataset.follow='false';if(pointerFrame)cancelAnimationFrame(pointerFrame);pointerFrame=0;resetGaze()}
function seek(time,key){pause();noFollow();holdTime=Math.max(0,Math.min(7200,time));animations.forEach(a=>{a.pause();a.currentTime=holdTime});if(reduce){const pos=key==='focus'?{x:4.5,y:-3.5}:key==='overview'?{x:-4.5,y:-3.5}:{x:0,y:0};setGaze(pos.x,pos.y)}setPhase(key||'rest')}
function tick(myGeneration){if(!playing||myGeneration!==generation)return;const t=currentTime();holdTime=t;if(t>=7198||animations.every(a=>a.playState==='finished')){pause();animations.forEach(a=>a.currentTime=7200);holdTime=7200;resetGaze();setPhase('rest');return}setPhase(phases.find(p=>t<p.end)?.key||'rest');loop=requestAnimationFrame(()=>tick(myGeneration))}
function play(restart=false){if(reduce)return;noFollow();if(restart||currentTime()>=7198){animations.forEach(a=>a.currentTime=0);holdTime=0}if(!animations.length)return;playing=true;animations.forEach(a=>a.play());updatePlay();stopLoop();loop=requestAnimationFrame(()=>tick(generation))}
function mount(code){pause();noFollow();animations.forEach(a=>a.cancel());generation++;selected=code;const d=assets.entries.find(e=>e.code===code);
hero.replaceChildren(node(d.motion));svg=hero.querySelector('svg');svg.id='observer-hero';svg.removeAttribute('width');svg.removeAttribute('height');svg.style.color='currentColor';attention=svg.querySelector('[data-part=attention]');baseAttention=attention?.getAttribute('transform')||'';
document.getElementById('context-logo').replaceChildren(node(d.logo));document.getElementById('inverse-logo').replaceChildren(node(d.logo));
document.querySelectorAll('#context-logo svg,#inverse-logo svg').forEach(n=>n.style.color='currentColor');
document.getElementById('samples').replaceChildren(...[22,28,36].map(size=>{const n=node(d.static);n.style.color='currentColor';n.setAttribute('width',size);n.setAttribute('height',size);return n}));
document.querySelectorAll('.variant').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.code===code)));
document.getElementById('static-link').href=d.symbolPath;document.getElementById('logo-link').href=d.logoPath;document.getElementById('motion-link').href=d.motionPath;
void svg.getBoundingClientRect();animations=svg.getAnimations({subtree:true});animations.forEach(a=>{a.pause();a.currentTime=0});holdTime=0;setPhase('rest');updatePlay()}
assets.entries.forEach(d=>{const n=node(d.static);n.style.color='currentColor';n.setAttribute('aria-hidden','true');n.setAttribute('focusable','false');document.querySelector('.variant[data-code='+d.code+']').setAttribute('aria-label',d.code+' '+d.name);document.querySelector('.variant[data-code='+d.code+'] .mini').append(n)});
document.getElementById('topword').replaceChildren(node(assets.word));
document.querySelectorAll('.variant').forEach(b=>b.addEventListener('click',()=>mount(b.dataset.code)));
playButton.addEventListener('click',()=>playing?pause():play());
document.getElementById('restart').addEventListener('click',()=>play(true));
document.querySelectorAll('.phase').forEach(b=>b.addEventListener('click',()=>seek(Number(b.dataset.time),b.dataset.phase)));
followBox.addEventListener('change',()=>{const on=followBox.checked;seek(0,'rest');following=on&&!reduce;followBox.checked=following;stage.dataset.follow=String(following);if(following)setPhase('pointer')});
stage.addEventListener('pointermove',e=>{if(!following||reduce)return;const r=hero.getBoundingClientRect(),s=stage.getBoundingClientRect();const x=(e.clientX-(r.left+r.width/2))/(s.width/2)*6,y=(e.clientY-(r.top+r.height/2))/(s.height/2)*6;if(pointerFrame)cancelAnimationFrame(pointerFrame);pointerFrame=requestAnimationFrame(()=>{pointerFrame=0;setGaze(x,y)})});
stage.addEventListener('pointerleave',()=>{if(pointerFrame)cancelAnimationFrame(pointerFrame);pointerFrame=0;if(following)resetGaze()});
document.addEventListener('keydown',e=>{if(!following)return;if(e.key==='Escape'){e.preventDefault();noFollow();setPhase('rest');followBox.focus();return}if(reduce||(e.target!==stage&&e.target!==followBox))return;const moves={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]};if(moves[e.key]){e.preventDefault();const [x,y]=moves[e.key];setGaze(gaze.x+x,gaze.y+y)}});
function setTheme(dark){root.dataset.myTheme=dark?'dark':'light';document.documentElement.dataset.myTheme=root.dataset.myTheme;document.documentElement.classList.toggle('dark',dark);document.getElementById('theme').setAttribute('aria-label',dark?'切换浅色':'切换深色');document.getElementById('theme').title=dark?'切换浅色':'切换深色'}
document.getElementById('theme').addEventListener('click',()=>setTheme(root.dataset.myTheme!=='dark'));
function reducedChanged(){const wasFocus=document.activeElement===playButton;reduce=reduceMedia.matches;pause();mount(selected);document.getElementById('reduced-note').textContent=reduce?'已按系统设置减少动态效果，可用阶段按钮查看静态姿态。':'';if(wasFocus&&reduce)document.querySelector('.phase').focus()}
reduceMedia.addEventListener('change',reducedChanged);
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();noFollow();setPhase('rest')}});
addEventListener('pagehide',()=>{pause();noFollow();animations.forEach(a=>a.cancel())});
const density=new URLSearchParams(location.search).get('density');if(['small','standard','large'].includes(density))root.dataset.myFontSize=density;
mount('A');document.getElementById('reduced-note').textContent=reduce?'已按系统设置减少动态效果，可用阶段按钮查看静态姿态。':'';
window.__observer={getState:()=>({selected,playing,phase,time:currentTime(),following,reduce,gaze:{...gaze},animationCount:animations.length,errors:[...errors]}),select:mount,play,pause,seek,setTheme,setDensity:v=>{root.dataset.myFontSize=v}};
