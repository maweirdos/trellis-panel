<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" fill="none">
  <title>Crux wordmark lockups</title>
  <desc>Four Crux logo directions with distinctive icons and lowercase wordmarks.</desc>
  <rect width="1240" height="900" fill="#111216"/>
  <text x="70" y="72" fill="#F5F4F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="2">CRUX / ICON + WORDMARK</text>
  <text x="70" y="108" fill="#9D9BA1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">A recognizable symbol and a lowercase wordmark, designed as one brand lockup.</text>

  <g transform="translate(70 160)">
    <rect width="520" height="280" rx="20" fill="#F8F8F7"/>
    <text x="34" y="42" fill="#4B74FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">01 / CONFLUENCE C</text>
    <text x="34" y="70" fill="#6D6B72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">“C” 是交汇的入口，中心是共同决策点</text>
    <g transform="translate(80 112) scale(1.15)">
      <path fill="#4B74FF" d="M52 13c-6-6-14-9-23-9C13 4 0 18 0 36s13 32 29 32c9 0 17-3 23-9l-10-10c-4 3-8 5-13 5-9 0-16-8-16-18s7-18 16-18c5 0 9 2 13 5l10-10Z"/>
      <path fill="#4B74FF" d="m35 36 11-7 11 7-11 7-11-7Z"/>
      <text x="82" y="50" fill="#4B74FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="650" letter-spacing="-1.8">crux</text>
    </g>
  </g>

  <g transform="translate(650 160)">
    <rect width="520" height="280" rx="20" fill="#F8F8F7"/>
    <text x="34" y="42" fill="#635BFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">02 / FOUR VOICES</text>
    <text x="34" y="70" fill="#6D6B72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">四种来源保持差异，最终共享一个核心</text>
    <g transform="translate(80 112) scale(1.15)" stroke="#635BFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 20c11-9 22-8 30 4l8 12M64 20c-11-9-22-8-30 4l-8 12M8 52c11 9 22 8 30-4l8-12M64 52c-11 9-22 8-30-4l-8-12"/>
      <circle cx="40" cy="36" r="8" fill="#635BFF" stroke="none"/>
      <text x="90" y="50" fill="#635BFF" stroke="none" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="650" letter-spacing="-1.8">crux</text>
    </g>
  </g>

  <g transform="translate(70 510)">
    <rect width="520" height="280" rx="20" fill="#F8F8F7"/>
    <text x="34" y="42" fill="#0B8F83" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">03 / SHARED THREAD</text>
    <text x="34" y="70" fill="#6D6B72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">上下文交换，接力成为一条连续工作线</text>
    <g transform="translate(80 112) scale(1.15)" stroke="#0B8F83" stroke-width="8" stroke-linecap="round">
      <path d="M5 36c9-20 26-20 35 0s26 20 35 0M5 36c9 20 26 20 35 0s26-20 35 0"/>
      <circle cx="40" cy="36" r="6" fill="#0B8F83" stroke="none"/>
      <text x="90" y="50" fill="#0B8F83" stroke="none" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="650" letter-spacing="-1.8">crux</text>
    </g>
  </g>

  <g transform="translate(650 510)">
    <rect width="520" height="280" rx="20" fill="#F8F8F7"/>
    <text x="34" y="42" fill="#1B1D21" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">04 / TRELLIS CORE</text>
    <text x="34" y="70" fill="#6D6B72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">把 Trellis 的支撑结构收束成一个品牌核心</text>
    <g transform="translate(80 112) scale(1.15)">
      <path fill="#1B1D21" fill-rule="evenodd" d="M28 5h18v18h18v18H46v18H28V41H10V23h18V5Zm9 25 6 6-6 6-6-6 6-6Z"/>
      <path d="M37 5v8M37 59v8M10 32h8M56 32h8" stroke="#4B74FF" stroke-width="4" stroke-linecap="round"/>
      <text x="90" y="50" fill="#1B1D21" stroke="none" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="650" letter-spacing="-1.8">crux</text>
    </g>
  </g>
</svg>
