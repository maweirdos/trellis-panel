<svg xmlns="http://www.w3.org/2000/svg" width="30.66667" height="31.66667" viewBox="0 0 30.66666666666667 31.66666666666667" fill="none" color="#242725" role="img" aria-labelledby="title desc"><title id="title">Crux — Continuity symbol</title><desc id="desc">一条连续笔画经过外部到内部，再保留新的出口，表达同一任务身份的可靠接续。</desc><g transform="translate(-0.166667 -0.166667) "><path d="M6 7v13a6 6 0 0 0 6 6h13V13H14V6" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>