<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" fill="none">
  <title>Crux monochrome wordmark directions</title>
  <desc>Four neutral Crux logo lockups built around crossing, shared context and a structural core.</desc>
  <rect width="1240" height="900" fill="#EEECE7"/>
  <text x="64" y="72" fill="#1B1D21" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="2">CRUX / MONOCHROME LOCKUPS</text>
  <text x="64" y="108" fill="#69655E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Graphite, paper white and a custom crossing point shared by icon and wordmark.</text>

  <g transform="translate(64 150)">
    <rect width="532" height="310" rx="20" fill="#FFF"/>
    <text x="32" y="42" fill="#1B1D21" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">01 / CROSSED C</text>
    <text x="32" y="69" fill="#69655E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">C 形入口与交叉点合成 Crux 的核心动作</text>
    <g transform="translate(198 112) scale(1.15)" stroke="#1B1D21" stroke-linecap="round" stroke-linejoin="round">
      <path d="M52 17c-6-6-14-10-23-10C13 7 2 20 2 36s11 29 27 29c9 0 17-3 23-10" stroke-width="8"/>
      <path d="m37 25 20 22M57 25 37 47" stroke-width="8"/>
      <circle cx="47" cy="36" r="4" fill="#1B1D21" stroke="none"/>
      <text x="88" y="50" fill="#1B1D21" stroke="none" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="650" letter-spacing="-1.8">crux</text>
    </g>
  </g>

  <g transform="translate(644 150)">
    <rect width="532" height="310" rx="20" fill="#FFF"/>
    <text x="32" y="42" fill="#1B1D21" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">02 / SHARED APERTURE</text>
    <text x="32" y="69" fill="#69655E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">四条结构轨道向同一工作核心打开</text>
    <g transform="translate(198 112) scale(1.15)" stroke="#1B1D21" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 19h22l10 10 10-10h22M8 53h22l10-10 10 10h22M40 29v14"/>
      <path d="m40 27 9 9-9 9-9-9 9-9Z" fill="#1B1D21" stroke="none"/>
      <text x="88" y="50" fill="#1B1D21" stroke="none" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="650" letter-spacing="-1.8">crux</text>
    </g>
  </g>

  <g transform="translate(64 510)">
    <rect width="532" height="310" rx="20" fill="#FFF"/>
    <text x="32" y="42" fill="#1B1D21" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">03 / SPLICED RIBBON</text>
    <text x="32" y="69" fill="#69655E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">上下文交换后，形成一条连续的协作路线</text>
    <g transform="translate(198 112) scale(1.15)" stroke="#1B1D21" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 22c9-12 20-12 29-2l3 4 3-4c9-10 20-10 29 2M8 50c9 12 20 12 29 2l3-4 3 4c9 10 20 10 29-2"/>
      <circle cx="40" cy="36" r="6" fill="#1B1D21" stroke="none"/>
      <text x="88" y="50" fill="#1B1D21" stroke="none" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="650" letter-spacing="-1.8">crux</text>
    </g>
  </g>

  <g transform="translate(644 510)">
    <rect width="532" height="310" rx="20" fill="#FFF"/>
    <text x="32" y="42" fill="#1B1D21" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">04 / CORE FRAME</text>
    <text x="32" y="69" fill="#69655E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Trellis 的承托结构收束成清晰的共享中心</text>
    <g transform="translate(198 112) scale(1.15)">
      <path fill="#1B1D21" fill-rule="evenodd" d="M10 13h23l7 7 7-7h23v18l-7 5 7 5v18H47l-7-7-7 7H10V41l7-5-7-5V13Zm30 17 6 6-6 6-6-6 6-6Z"/>
      <path d="M40 13v7M40 52v7M10 36h7M63 36h7" stroke="#1B1D21" stroke-width="4" stroke-linecap="round"/>
      <text x="88" y="50" fill="#1B1D21" stroke="none" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="650" letter-spacing="-1.8">crux</text>
    </g>
  </g>
</svg>
