<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <title>Crux - 02 The Nexus Mobius</title>
  <desc>Topological continuous mobius loops interwoven into a unified cross of human and agent intelligence.</desc>
  <defs>
    <!-- Primary Gradient (Silver Cyan) -->
    <linearGradient id="mobius-grad-1" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="mobius-grad-2" x1="100" y1="20" x2="20" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Subtle drop shadow filter for floating overlap -->
    <filter id="overlap-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Under Loop (Diagonal Southeast-Northwest Flow) -->
  <path d="M26 26 C42 10, 78 10, 94 26 C110 42, 110 78, 94 94 C78 110, 42 110, 26 94 C10 78, 10 42, 26 26 Z" 
        stroke="url(#mobius-grad-2)" stroke-width="7" stroke-dasharray="115 16 115 16" stroke-dashoffset="8" stroke-linecap="round"/>

  <!-- Four Inward Converging Arcs Forming Crux Center -->
  <!-- Top Leaf -->
  <path d="M60 14 C68 28, 76 44, 76 60 C64 60, 48 52, 44 38 C40 24, 52 14, 60 14 Z" 
        fill="url(#mobius-grad-1)" opacity="0.95" filter="url(#overlap-shadow)"/>
  
  <!-- Right Leaf -->
  <path d="M106 60 C92 68, 76 76, 60 76 C60 64, 68 48, 82 44 C96 40, 106 52, 106 60 Z" 
        fill="url(#mobius-grad-1)" opacity="0.95" filter="url(#overlap-shadow)"/>

  <!-- Bottom Leaf -->
  <path d="M60 106 C52 92, 44 76, 44 60 C56 60, 72 68, 76 82 C80 96, 68 106, 60 106 Z" 
        fill="url(#mobius-grad-1)" opacity="0.95" filter="url(#overlap-shadow)"/>

  <!-- Left Leaf -->
  <path d="M14 60 C28 52, 44 44, 60 44 C60 56, 52 72, 38 76 C24 80, 14 68, 14 60 Z" 
        fill="url(#mobius-grad-1)" opacity="0.95" filter="url(#overlap-shadow)"/>

  <!-- Center Luminescent Intersection -->
  <circle cx="60" cy="60" r="3.5" fill="#FFFFFF"/>
</svg>
