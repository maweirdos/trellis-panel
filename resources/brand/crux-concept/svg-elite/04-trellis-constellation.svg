<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <title>Crux - 04 The Trellis Constellation</title>
  <desc>Four modular architectural blocks whose negative space sculpts a radiant Southern Cross star.</desc>
  <defs>
    <!-- Deep Obsidian to Titanium Slate Gradient -->
    <linearGradient id="quad-tl" x1="20" y1="20" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="quad-tr" x1="100" y1="20" x2="64" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="quad-br" x1="100" y1="100" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="60%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="quad-bl" x1="20" y1="100" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Four Precision Monolithic Quads with Negative-Space Star Radii -->
  
  <!-- Top-Left Monolith -->
  <path d="M30 18 H54 C54 39, 39 54, 18 54 V30 C18 23.4, 23.4 18, 30 18 Z" 
        fill="url(#quad-tl)"/>

  <!-- Top-Right Monolith -->
  <path d="M66 54 C87 54, 102 39, 102 18 H78 C71.4 18, 66 23.4, 66 30 V54 Z" 
        fill="url(#quad-tr)"/>

  <!-- Bottom-Right Monolith -->
  <path d="M90 102 H66 V78 C66 71.4, 71.4 66, 78 66 H102 C102 87, 87 102, 66 102 Z" 
        fill="url(#quad-br)"/>

  <!-- Bottom-Left Monolith -->
  <path d="M54 66 V90 C54 96.6, 48.6 102, 42 102 H18 C18 81, 33 66, 54 66 Z" 
        fill="url(#quad-bl)"/>

  <!-- Central Star Focus Dot -->
  <circle cx="60" cy="60" r="2.8" fill="#FFFFFF"/>
</svg>
