appId: com.mindfold.trellispanel
productName: Crux
publish: null
directories:
  output: release
files:
  - out/**
  - "!out/worker-only/**"
  - "!out/pi-engine/**"
  - "!out/speech/**"
  - "!node_modules/transcribe-cpp/**"
  - "!node_modules/@transcribe-cpp/**"
  - "!node_modules/koffi/**"
  - "!node_modules/@koromix/koffi-*/**"
  - package.json
  - resources/brand/**
  - "!resources/brand/crux-concept/**"
  - "!resources/brand/README.md"
  - resources/licenses/**
# ZCode ACP 桥接适配器（launchKind 'bundled'）：整目录复制进 resources/adapters，
# 运行侧由 services/acp/setup.ts resolveAdapterEntry() 从 process.resourcesPath 解析。
extraResources:
  - from: out/team-trellis
    to: team-trellis
    filter:
      - manifest.json
      - installer.mjs
      - scripts/task.py
      - scripts/common/io.py
      - scripts/common/task_store.py
      - scripts/common/task_utils.py
      - scripts/common/task_authority.py
      - scripts/hooks/linear_sync.py
  - from: out/pi-engine
    to: pi-engine
    filter:
      - engine.mjs
      - text-completion.mjs
      - sdk-manifest.json
  - from: out/pi-engine/node_modules
    to: pi-engine/node_modules
    filter:
      - "**/*"
  - from: out/speech
    to: speech
    filter:
      - worker.mjs
  - from: out/speech/node_modules
    to: speech/node_modules
    filter:
      - "**/*"
  - from: node_modules/.cache/trellis-node/dist/node-v24.12.0-win-x64
    to: node-runtime/win-x64
    filter:
      - node.exe
      - LICENSE
  - from: resources/daemon
    to: daemon
  - from: adapters/zcode-acp
    to: adapters/zcode-acp
    filter:
      - package.json
      - src/**
# worker_threads 无法从 asar 内加载文件：邻位 worker 产物解包到 app.asar.unpacked
# （加载侧由 services/worker-path.ts 重写路径）
asarUnpack:
  - "out/main/*-worker.js"
  - "out/main/daemon-cli.js"
  - "out/main/daemon-host.js"
  - "node_modules/@anthropic-ai/claude-agent-sdk-win32-*/claude.exe"
win:
  icon: resources/brand/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Crux-Setup-${version}.exe
nsis:
  include: resources/installer/lifecycle.nsh
  installerIcon: resources/brand/icon.ico
  uninstallerIcon: resources/brand/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Crux
